name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install release scanner dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Check for Python files, legacy web files, paths, and secrets
        run: ./scripts/scan-release.sh

      - name: Validate the public release contract
        run: |
          ./tests/release-contract.sh
          ./tests/scan-release-test.sh

      - name: Compile Java 11, run tests, and build the DEB
        run: ./package/build-deb.sh

      - name: Inspect the DEB and verify its checksum
        run: ./scripts/inspect-package.sh

      - name: Verify a reproducible second build
        run: ./scripts/verify-reproducible-build.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: bitget-private-terminal-3.1.1
          path: |
            dist/bitget-private-terminal_3.1.1_all.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
